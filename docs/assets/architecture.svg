<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="title desc">
  <title id="title">ClaimGuard AI v0.3 Architecture</title>
  <desc id="desc">ClaimGuard v0.3 builds a local index explicitly, then retrieves clause evidence only for grounded QA runs that provide that index.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { fill: #111827; font-size: 26px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 14px; }
    .layer { fill: #6b7280; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .node-title { fill: #111827; font-size: 15px; font-weight: 700; }
    .node-sub { fill: #4b5563; font-size: 12px; }
    .small { fill: #6b7280; font-size: 11px; }
    .edge-label { fill: #374151; font-size: 11px; }
    .badge { fill: #065f46; font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
  </defs>
  <g data-graph-role="background"><rect width="1200" height="780" fill="#ffffff"/></g>
  <g data-graph-role="background"><line x1="50" y1="96" x2="1150" y2="96" stroke="#e5e7eb" stroke-width="1.4"/><text x="50" y="118" class="layer">TEXT INPUTS</text></g>
  <g data-graph-role="background"><line x1="50" y1="216" x2="1150" y2="216" stroke="#e5e7eb" stroke-width="1.4"/><text x="50" y="238" class="layer">EXPLICIT INDEX BUILD</text></g>
  <g data-graph-role="background"><line x1="50" y1="426" x2="1150" y2="426" stroke="#e5e7eb" stroke-width="1.4"/><text x="50" y="448" class="layer">GROUNDED QA</text></g>
  <g data-graph-role="background"><line x1="50" y1="596" x2="1150" y2="596" stroke="#e5e7eb" stroke-width="1.4"/><text x="50" y="618" class="layer">OUTPUTS AND FUTURE</text></g>
  <g data-graph-role="label"><text x="60" y="48" class="title">ClaimGuard AI Architecture</text><text x="60" y="72" class="subtitle">v0.3 builds an ignored local index explicitly, then retrieves evidence only for grounded QA runs.</text><rect x="846" y="28" width="284" height="40" rx="20" fill="#ecfdf5" stroke="#10b981"/><text x="988" y="53" text-anchor="middle" class="badge">Current: v0.3.0 RAG grounding</text></g>
  <path data-graph-role="edge" data-source="policy" data-target="parser" d="M 200,184 L 200,260" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text data-graph-role="label" x="265" y="230" text-anchor="middle" class="edge-label">index command</text>
  <path data-graph-role="edge" data-source="parser" data-target="index_embedding" d="M 280,295 L 380,295" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text data-graph-role="label" x="330" y="252" text-anchor="middle" class="edge-label">clause text</text>
  <path data-graph-role="edge" data-source="index_embedding" data-target="index" d="M 540,295 L 680,295" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text data-graph-role="label" x="610" y="252" text-anchor="middle" class="edge-label">write index</text>
  <path data-graph-role="edge" data-source="conversation" data-target="rules" d="M 280,505 L 340,505" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text data-graph-role="label" x="310" y="454" text-anchor="middle" class="edge-label">matched rule</text>
  <path data-graph-role="edge" data-source="rules" data-target="query_embedding" d="M 530,505 L 570,505" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text data-graph-role="label" x="550" y="454" text-anchor="middle" class="edge-label">grounded query</text>
  <path data-graph-role="edge" data-source="query_embedding" data-target="index" d="M 730,505 L 760,505 L 760,330" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text data-graph-role="label" x="815" y="400" text-anchor="middle" class="edge-label">query vector</text>
  <path data-graph-role="edge" data-source="index" data-target="evidence" d="M 860,295 L 980,295 L 980,470" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text data-graph-role="label" x="920" y="252" text-anchor="middle" class="edge-label">read index</text>
  <path data-graph-role="edge" data-source="evidence" data-target="report" d="M 980,540 L 980,590 L 805,590 L 805,620" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text data-graph-role="label" x="890" y="582" text-anchor="middle" class="edge-label">grounding</text>
  <path data-graph-role="edge" data-source="report" data-target="release" d="M 690,649 L 590,649" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text data-graph-role="label" x="640" y="639" text-anchor="middle" class="edge-label">verify</text>
  <g data-graph-role="node" data-node-id="policy" data-graph-bounds="100 126 300 184">
    <rect x="100" y="126" width="200" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
    <text x="200.0" y="154" text-anchor="middle" class="node-title">Chinese Policy</text>
    <text x="200.0" y="177" text-anchor="middle" class="node-sub">claimguard index input</text>
  </g>
  <g data-graph-role="node" data-node-id="parser" data-graph-bounds="120 260 280 330">
    <rect x="120" y="260" width="160" height="70" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
    <text x="200.0" y="288" text-anchor="middle" class="node-title">Policy Parser</text>
    <text x="200.0" y="311" text-anchor="middle" class="node-sub">Chinese clauses</text>
    <text x="200.0" y="328" text-anchor="middle" class="node-sub">validated IDs</text>
  </g>
  <g data-graph-role="node" data-node-id="index_embedding" data-graph-bounds="380 260 540 330">
    <rect x="380" y="260" width="160" height="70" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.6"/>
    <text x="460.0" y="288" text-anchor="middle" class="node-title">Index Embedding</text>
    <text x="460.0" y="311" text-anchor="middle" class="node-sub">qwen3.7-text</text>
    <text x="460.0" y="328" text-anchor="middle" class="node-sub">embedding</text>
  </g>
  <g data-graph-role="node" data-node-id="index" data-graph-bounds="680 260 860 330">
    <rect x="680" y="260" width="180" height="70" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.6"/>
    <text x="770.0" y="288" text-anchor="middle" class="node-title">Local Index</text>
    <text x="770.0" y="311" text-anchor="middle" class="node-sub">.claimguard/</text>
    <text x="770.0" y="328" text-anchor="middle" class="node-sub">ignored JSON</text>
  </g>
  <g data-graph-role="node" data-node-id="conversation" data-graph-bounds="100 470 280 540">
    <rect x="100" y="470" width="180" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
    <text x="190.0" y="498" text-anchor="middle" class="node-title">Completed Conversation</text>
    <text x="190.0" y="521" text-anchor="middle" class="node-sub">grounded QA</text>
    <text x="190.0" y="538" text-anchor="middle" class="node-sub">with --index</text>
  </g>
  <g data-graph-role="node" data-node-id="rules" data-graph-bounds="340 470 530 540">
    <rect x="340" y="470" width="190" height="70" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/>
    <text x="435.0" y="498" text-anchor="middle" class="node-title">Deterministic Rules</text>
    <text x="435.0" y="521" text-anchor="middle" class="node-sub">RAG-001 to</text>
    <text x="435.0" y="538" text-anchor="middle" class="node-sub">RAG-005</text>
  </g>
  <g data-graph-role="node" data-node-id="query_embedding" data-graph-bounds="570 470 730 540">
    <rect x="570" y="470" width="160" height="70" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.6"/>
    <text x="650.0" y="498" text-anchor="middle" class="node-title">Query Embedding</text>
    <text x="650.0" y="521" text-anchor="middle" class="node-sub">only grounded</text>
    <text x="650.0" y="538" text-anchor="middle" class="node-sub">matches</text>
  </g>
  <g data-graph-role="node" data-node-id="evidence" data-graph-bounds="900 470 1060 540">
    <rect x="900" y="470" width="160" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="980.0" y="498" text-anchor="middle" class="node-title">Retrieval Evidence</text>
    <text x="980.0" y="521" text-anchor="middle" class="node-sub">clause + source</text>
    <text x="980.0" y="538" text-anchor="middle" class="node-sub">score</text>
  </g>
  <g data-graph-role="node" data-node-id="release" data-graph-bounds="360 620 590 678">
    <rect x="360" y="620" width="230" height="58" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.6"/>
    <text x="475.0" y="648" text-anchor="middle" class="node-title">Tests + Release Docs</text>
    <text x="475.0" y="671" text-anchor="middle" class="node-sub">v0.3.0 metadata</text>
  </g>
  <g data-graph-role="node" data-node-id="report" data-graph-bounds="690 620 920 678">
    <rect x="690" y="620" width="230" height="58" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.6"/>
    <text x="805.0" y="648" text-anchor="middle" class="node-title">QA JSON Report</text>
    <text x="805.0" y="671" text-anchor="middle" class="node-sub">additive grounding</text>
  </g>
  <g data-graph-role="node" data-node-id="future" data-graph-bounds="960 620 1130 678">
    <rect x="960" y="620" width="170" height="58" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="1045.0" y="648" text-anchor="middle" class="node-title">LLM Judge</text>
    <text x="1045.0" y="671" text-anchor="middle" class="node-sub">deferred</text>
  </g>
  <g data-graph-role="legend" transform="translate(70,740)">
    <line x1="0" y1="8" x2="36" y2="8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="46" y="12" class="small">active QA/report flow</text>
    <line x1="255" y1="8" x2="291" y2="8" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
    <text x="301" y="12" class="small">index read/write</text>
    <line x1="465" y1="8" x2="501" y2="8" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text x="511" y="12" class="small">embedding transform</text>
    <line x1="700" y1="8" x2="736" y2="8" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
    <text x="746" y="12" class="small">deferred extension</text>
  </g>
</svg>
