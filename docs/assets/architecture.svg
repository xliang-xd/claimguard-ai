<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-labelledby="title desc">
  <title id="title">ClaimGuard AI v0.4.2 架构</title>
  <desc id="desc">当前 QA 路径保持不变。v0.4.2 新增尚未启用的 Web 和 CLI 到 Agents SDK Runner、Qwen Provider、本地 Session 与审计设计。</desc>
  <style>
    text { font-family: 'Hiragino Sans GB', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }
    .title { fill: #111827; font-size: 28px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 15px; }
    .lane { fill: #6b7280; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
    .node-title { fill: #111827; font-size: 16px; font-weight: 700; }
    .node-sub { fill: #4b5563; font-size: 12px; }
    .note { fill: #6b7280; font-size: 12px; }
    .edge-label { fill: #374151; font-size: 11px; font-weight: 600; }
    .current { fill: #065f46; font-size: 12px; font-weight: 700; }
    .next { fill: #9a3412; font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#9333ea"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/></marker>
  </defs>
  <rect width="1600" height="1100" fill="#ffffff"/>
  <text x="70" y="58" class="title">ClaimGuard AI 架构</text>
  <text x="70" y="84" class="subtitle">当前对外能力仍是 v0.4 QA；v0.4.2 仅增加 Agents SDK Copilot 设计，不启用运行代码。</text>

  <g data-graph-role="container">
    <rect x="55" y="118" width="1015" height="216" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="78" y="145" class="lane">显式索引构建</text>
    <text x="78" y="166" class="note">仅通过 claimguard index 运行；此路径独立于普通 QA。</text>
  </g>
  <g data-graph-role="node">
    <rect x="90" y="205" width="165" height="78" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.6"/>
    <text x="172" y="235" text-anchor="middle" class="node-title">保单 Markdown</text>
    <text x="172" y="256" text-anchor="middle" class="node-sub">合成条款</text>
    <rect x="330" y="205" width="165" height="78" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.6"/>
    <text x="412" y="235" text-anchor="middle" class="node-title">保单解析器</text>
    <text x="412" y="256" text-anchor="middle" class="node-sub">带标题的章节</text>
    <rect x="570" y="205" width="190" height="78" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.6"/>
    <text x="665" y="235" text-anchor="middle" class="node-title">Qwen Embedding</text>
    <text x="665" y="256" text-anchor="middle" class="node-sub">qwen3.7-text-embedding</text>
    <rect x="835" y="205" width="175" height="78" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.6"/>
    <text x="922" y="235" text-anchor="middle" class="node-title">本地 JSON 索引</text>
    <text x="922" y="256" text-anchor="middle" class="node-sub">.claimguard/ 已忽略</text>
  </g>
  <path data-graph-role="edge" d="M255 244 H330" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" d="M495 244 H570" fill="none" stroke="#9333ea" stroke-width="2.3" marker-end="url(#arrow-purple)"/>
  <path data-graph-role="edge" d="M760 244 H835" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#arrow-green)"/>

  <g data-graph-role="container">
    <rect x="55" y="382" width="1490" height="290" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="78" y="410" class="lane">当前 QA 路径</text>
    <text x="78" y="431" class="note">旧调用在确定性 QA 后结束；可选节点只在传入对应 CLI 标志时运行。</text>
  </g>
  <g data-graph-role="node">
    <rect x="85" y="505" width="165" height="88" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="167" y="537" text-anchor="middle" class="node-title">对话</text>
    <text x="167" y="559" text-anchor="middle" class="node-sub">已完成文字转录</text>
    <rect x="315" y="505" width="195" height="88" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="412" y="537" text-anchor="middle" class="node-title">确定性规则</text>
    <text x="412" y="559" text-anchor="middle" class="node-sub">始终生效</text>
    <rect x="575" y="505" width="205" height="88" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.6"/>
    <text x="677" y="537" text-anchor="middle" class="node-title">可选 RAG 检索</text>
    <text x="677" y="559" text-anchor="middle" class="node-sub">仅传入 --index</text>
    <rect x="845" y="505" width="205" height="88" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.6"/>
    <text x="947" y="537" text-anchor="middle" class="node-title">语义裁判</text>
    <text x="947" y="559" text-anchor="middle" class="node-sub">Qwen；仅传入 --llm</text>
    <rect x="1115" y="505" width="220" height="88" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
    <text x="1225" y="531" text-anchor="middle" class="node-title">证据验证器</text>
    <text x="1225" y="552" text-anchor="middle" class="node-title">+ 去重器</text>
    <text x="1225" y="574" text-anchor="middle" class="node-sub">要求完整引文</text>
    <rect x="1385" y="505" width="120" height="88" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="1445" y="537" text-anchor="middle" class="node-title">QA JSON</text>
    <text x="1445" y="559" text-anchor="middle" class="node-sub">报告</text>
  </g>
  <path data-graph-role="edge" d="M250 549 H315" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path data-graph-role="edge" d="M510 549 H575" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path data-graph-role="edge" d="M780 549 H845" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path data-graph-role="edge" d="M1050 549 H1115" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path data-graph-role="edge" d="M1335 549 H1385" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="677" y="486" text-anchor="middle" class="edge-label">可选 --index</text>
  <text x="947" y="486" text-anchor="middle" class="edge-label">--llm 时调用一次</text>
  <text x="1225" y="486" text-anchor="middle" class="edge-label">仅保留已验证结论</text>
  <path data-graph-role="edge" d="M922 283 V449 H677 V505" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-green)"/>
  <text x="810" y="438" text-anchor="middle" class="edge-label">读取既有索引</text>
  <rect x="1085" y="623" width="372" height="28" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="1271" y="642" text-anchor="middle" class="current">当前：v0.4 QA（行为不变）</text>

  <g data-graph-role="container">
    <rect x="55" y="705" width="1490" height="285" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="78" y="733" class="lane">未来 COPILOT 路径 - V0.4.2 仅设计</text>
    <text x="78" y="754" class="note">OpenAI 托管 tracing 默认关闭；应用保存本地 Session 和 AuditEvent。</text>
  </g>
  <g data-graph-role="node">
    <rect x="90" y="820" width="170" height="78" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="175" y="850" text-anchor="middle" class="node-title">Web / CLI</text>
    <text x="175" y="872" text-anchor="middle" class="node-sub">未来服务入口</text>
    <rect x="380" y="820" width="220" height="78" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="490" y="850" text-anchor="middle" class="node-title">Agents SDK Runner</text>
    <text x="490" y="872" text-anchor="middle" class="node-sub">Agent 与 Handoff</text>
    <rect x="720" y="820" width="210" height="78" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="825" y="850" text-anchor="middle" class="node-title">Qwen Provider</text>
    <text x="825" y="872" text-anchor="middle" class="node-sub">中国大陆 Model Studio</text>
  </g>
  <path data-graph-role="edge" d="M260 859 H380" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/>
  <path data-graph-role="edge" d="M600 859 H720" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/>
  <rect x="380" y="776" width="315" height="28" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="537" y="795" text-anchor="middle" class="next">下一项：v0.5 Router -&gt; Policy Handoff</text>

  <g data-graph-role="container">
    <rect x="1050" y="780" width="430" height="190" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="1072" y="807" class="lane">本地 SESSION / AUDIT 边界</text>
  </g>
  <g data-graph-role="node">
    <rect x="1085" y="830" width="160" height="70" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1165" y="859" text-anchor="middle" class="node-title">Session</text>
    <text x="1165" y="881" text-anchor="middle" class="node-sub">会话与 RunState</text>
    <rect x="1280" y="830" width="160" height="70" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1360" y="859" text-anchor="middle" class="node-title">AuditEvent</text>
    <text x="1360" y="881" text-anchor="middle" class="node-sub">本地结构化审计</text>
  </g>
  <g data-graph-role="legend" transform="translate(70,1030)">
    <line x1="0" y1="8" x2="38" y2="8" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
    <text x="50" y="12" class="note">QA 流程</text>
    <line x1="175" y1="8" x2="213" y2="8" stroke="#16a34a" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-green)"/>
    <text x="225" y="12" class="note">索引构建/读取</text>
    <line x1="395" y1="8" x2="433" y2="8" stroke="#9333ea" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
    <text x="445" y="12" class="note">Embedding 转换</text>
    <line x1="655" y1="8" x2="693" y2="8" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
    <text x="705" y="12" class="note">未来 Copilot 设计</text>
  </g>
  <text x="70" y="1080" class="note">v0.4.2 只记录设计；v0.5 才启用最小 Router -&gt; Policy Handoff，所有模型仍默认使用 Qwen。</text>
</svg>
