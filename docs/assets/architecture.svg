<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc" data-generator="fireworks-tech-graph" data-quality-profile="showcase">
  <title id="title">ClaimGuard AI v0.6 架构</title>
  <desc id="desc">当前 Copilot 路径通过 Policy Tool、内存 Evidence Ledger、Citation Judge 和 Runtime Gate。只有 supported verdict 允许交付草稿；独立 QA 保持离线默认行为。</desc>
  <style>
    text { font-family: 'Arial Unicode MS', 'Hiragino Sans GB', Arial, sans-serif; }
    .title { fill:#111827; font-size:24px; font-weight:600; }
    .subtitle { fill:#6b7280; font-size:13px; }
    .lane { fill:#374151; font-size:12px; font-weight:600; }
    .node-title { fill:#111827; font-size:14px; font-weight:600; }
    .node-sub { fill:#4b5563; font-size:12px; }
    .note { fill:#6b7280; font-size:12px; }
    .state { fill:#065f46; font-size:12px; font-weight:600; }
    .future { fill:#6b7280; font-size:12px; font-weight:600; }
  </style>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect data-graph-role="background" width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="48" class="title">ClaimGuard AI v0.6.0 架构</text>
  <text x="48" y="72" class="subtitle">当前交付链路以引用核验为硬门槛；绿色为当前 Copilot 证据流，蓝色为独立 QA。</text>

  <rect data-graph-role="container" id="copilot-current" x="40" y="104" width="1120" height="390" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="64" y="132" class="lane">当前 v0.6.0 COPILOT：唯一 Handoff 为 Router -&gt; Policy Agent</text>
  <text x="64" y="154" class="note">Evidence Ledger：仅当前进程、当前轮的内存；每轮开始清空。</text>

  <rect data-graph-role="node" data-node-id="router" x="60" y="202" width="130" height="82" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="125" y="235" text-anchor="middle" class="node-title">Router</text>
  <text x="125" y="258" text-anchor="middle" class="node-sub">仅转 Policy</text>

  <rect data-graph-role="node" data-node-id="policy" x="240" y="202" width="130" height="82" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="305" y="235" text-anchor="middle" class="node-title">Policy Agent</text>
  <text x="305" y="258" text-anchor="middle" class="node-sub">条款解释</text>

  <rect data-graph-role="node" data-node-id="policy-tool" x="420" y="202" width="130" height="82" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="485" y="235" text-anchor="middle" class="node-title">Policy Tool</text>
  <text x="485" y="258" text-anchor="middle" class="node-sub">检索 + 重排</text>

  <rect data-graph-role="node" data-node-id="ledger" x="600" y="202" width="140" height="82" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="670" y="235" text-anchor="middle" class="node-title">Evidence Ledger</text>
  <text x="670" y="258" text-anchor="middle" class="node-sub">内存 / 当前轮</text>

  <rect data-graph-role="node" data-node-id="judge" x="790" y="202" width="140" height="82" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="860" y="235" text-anchor="middle" class="node-title">Citation Judge</text>
  <text x="860" y="258" text-anchor="middle" class="node-sub">严格 verdict</text>

  <rect data-graph-role="node" data-node-id="gate" x="980" y="202" width="130" height="82" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1045" y="235" text-anchor="middle" class="node-title">Runtime Gate</text>
  <text x="1045" y="258" text-anchor="middle" class="node-sub">再次核验</text>

  <path data-graph-role="edge" data-edge-id="router-policy" data-source="router" data-target="policy" d="M190 243 H240" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" data-edge-id="policy-tool" data-source="policy" data-target="policy-tool" d="M370 243 H420" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" data-edge-id="tool-ledger" data-source="policy-tool" data-target="ledger" d="M550 243 H600" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" data-edge-id="ledger-judge" data-source="ledger" data-target="judge" d="M740 243 H790" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" data-edge-id="judge-gate" data-source="judge" data-target="gate" d="M930 243 H980" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>

  <rect data-graph-role="node" data-node-id="deliver" x="810" y="376" width="150" height="72" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="885" y="406" text-anchor="middle" class="node-title">交付草稿</text>
  <text x="885" y="429" text-anchor="middle" class="node-sub">仅 supported</text>
  <rect data-graph-role="node" data-node-id="takeover" x="1010" y="376" width="120" height="72" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="1070" y="406" text-anchor="middle" class="node-title">转人工</text>
  <text x="1070" y="429" text-anchor="middle" class="node-sub">其余结果</text>
  <path data-graph-role="edge" data-edge-id="gate-deliver" data-source="gate" data-target="deliver" d="M1028 284 V332 H885 V376" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" data-edge-id="gate-takeover" data-source="gate" data-target="takeover" d="M1062 284 V376" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="885" y="354" text-anchor="middle" class="state">验证通过后保存本进程会话状态</text>

  <rect data-graph-role="container" id="qa-current" x="40" y="530" width="790" height="145" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="64" y="558" class="lane">独立 QA：默认离线，不参与实时 Handoff</text>
  <rect data-graph-role="node" data-node-id="qa-input" x="75" y="584" width="160" height="58" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="155" y="619" text-anchor="middle" class="node-title">已完成对话</text>
  <rect data-graph-role="node" data-node-id="qa-agent" x="340" y="584" width="190" height="58" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="435" y="610" text-anchor="middle" class="node-title">QA Agent</text>
  <text x="435" y="630" text-anchor="middle" class="node-sub">规则 + 可选 RAG / 语义</text>
  <rect data-graph-role="node" data-node-id="qa-report" x="635" y="584" width="160" height="58" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="715" y="619" text-anchor="middle" class="node-title">QA JSON 报告</text>
  <path data-graph-role="edge" data-edge-id="qa-input-agent" data-source="qa-input" data-target="qa-agent" d="M235 613 H340" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path data-graph-role="edge" data-edge-id="qa-agent-report" data-source="qa-agent" data-target="qa-report" d="M530 613 H635" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

  <rect data-graph-role="container" id="future-boundary" x="870" y="530" width="290" height="145" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="895" y="560" class="future">v0.7.0 下一项</text>
  <text x="895" y="588" class="note">仅标注后续范围。</text>
  <text x="895" y="610" class="note">不绘制为当前节点、</text>
  <text x="895" y="632" class="note">接口或运行路径。</text>

  <g data-graph-role="legend" transform="translate(52,710)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
    <text x="45" y="4" class="note">当前 Copilot 证据流</text>
    <line x1="215" y1="0" x2="249" y2="0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
    <text x="260" y="4" class="note">独立 QA</text>
    <line x1="380" y1="0" x2="414" y2="0" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
    <text x="425" y="4" class="note">后续边界</text>
  </g>
