<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc" data-generator="fireworks-tech-graph" data-quality-profile="showcase">
  <title id="title">ClaimGuard AI v0.6 Agent 编排</title>
  <desc id="desc">当前只有 Router 到 Policy Agent 的 Handoff，随后由 Policy Tool、Evidence Ledger、Citation Judge 和 Runtime Gate 决定交付或转人工。QA Agent 独立运行。</desc>
  <style>
    text { font-family: 'Arial Unicode MS', 'Hiragino Sans GB', Arial, sans-serif; }
    .title { fill:#111827; font-size:24px; font-weight:600; }
    .subtitle { fill:#6b7280; font-size:13px; }
    .lane { fill:#374151; font-size:12px; font-weight:600; }
    .node-title { fill:#111827; font-size:14px; font-weight:600; }
    .node-sub { fill:#4b5563; font-size:12px; }
    .note { fill:#6b7280; font-size:12px; }
    .current { fill:#065f46; font-size:12px; font-weight:600; }
    .future { fill:#6b7280; font-size:12px; font-weight:600; }
  </style>
  <defs>
    <marker id="green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect data-graph-role="background" width="1200" height="720" fill="#ffffff"/>
  <text x="48" y="48" class="title">ClaimGuard AI v0.6.0 Agent 编排</text>
  <text x="48" y="72" class="subtitle">当前只保留一个 Agent Handoff；引用核验在 Policy Agent 之后由 Runtime 强制执行。</text>

  <rect data-graph-role="container" id="current-copilot" x="20" y="104" width="1160" height="390" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="64" y="132" class="lane">当前 v0.6.0 COPILOT 编排</text>
  <text x="64" y="154" class="note">绿色链路是已实现路径；Runtime Gate 是交付硬门槛，而非提示词约定。</text>

  <rect data-graph-role="node" data-node-id="message" x="60" y="205" width="125" height="78" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="122" y="237" text-anchor="middle" class="node-title">客户消息</text>
  <text x="122" y="259" text-anchor="middle" class="node-sub">本轮输入</text>
  <rect data-graph-role="node" data-node-id="router" x="225" y="205" width="125" height="78" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="287" y="237" text-anchor="middle" class="node-title">Router Agent</text>
  <text x="287" y="259" text-anchor="middle" class="node-sub">仅转 Policy</text>
  <rect data-graph-role="node" data-node-id="policy" x="390" y="205" width="125" height="78" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="452" y="237" text-anchor="middle" class="node-title">Policy Agent</text>
  <text x="452" y="259" text-anchor="middle" class="node-sub">条款解释</text>
