<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-labelledby="title desc">
  <title id="title">ClaimGuard AI v0.4.2 Agent 编排</title>
  <desc id="desc">v0.4.2 记录 Router 到 Policy、Claims 和 Complaint Agent 的未来 Handoff 设计，Compliance Guard 横跨所有 Copilot Agent。当前 QA Agent 保持独立，v0.5 只启用 Router 到 Policy。</desc>
  <style>
    text { font-family: 'Hiragino Sans GB', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }
    .title { fill: #111827; font-size: 27px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 14px; }
    .lane { fill: #6b7280; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
    .node-title { fill: #111827; font-size: 15px; font-weight: 700; }
    .node-sub { fill: #4b5563; font-size: 12px; }
    .small { fill: #6b7280; font-size: 11px; }
    .edge-label { fill: #374151; font-size: 11px; font-weight: 600; }
    .current { fill: #065f46; font-size: 12px; font-weight: 700; }
    .next { fill: #9a3412; font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/></marker>
    <marker id="gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6b7280"/></marker>
  </defs>
  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="65" y="56" class="title">ClaimGuard AI Agent 编排</text>
  <text x="65" y="82" class="subtitle">v0.4.2 仅记录 Copilot 设计；当前对外运行能力仍是独立的 v0.4 QA。</text>

  <g data-graph-role="container">
    <rect x="50" y="115" width="1400" height="430" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="75" y="144" class="lane">未来 COPILOT - OPENAI AGENTS SDK FOR PYTHON</text>
  </g>
  <g data-graph-role="container">
    <rect x="80" y="160" width="1340" height="340" rx="10" fill="#fef2f2" fill-opacity="0.6" stroke="#f87171" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="103" y="187" class="lane">COMPLIANCE GUARD - 横跨 ROUTER 与所有专业 AGENT</text>
  </g>

  <g data-graph-role="node">
    <rect x="640" y="210" width="220" height="84" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="644" y="214" width="212" height="76" rx="6" fill="none" stroke="#bfdbfe" stroke-width="1"/>
    <text x="750" y="243" text-anchor="middle" class="node-title">Router Agent</text>
    <text x="750" y="265" text-anchor="middle" class="node-sub">只负责意图分流</text>
    <text x="750" y="282" text-anchor="middle" class="small">qwen3.8-flash</text>

    <rect x="235" y="385" width="220" height="86" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <rect x="239" y="389" width="212" height="78" rx="6" fill="none" stroke="#fed7aa" stroke-width="1"/>
    <text x="345" y="417" text-anchor="middle" class="node-title">Policy Agent</text>
    <text x="345" y="439" text-anchor="middle" class="node-sub">保单与条款解释</text>
    <text x="345" y="457" text-anchor="middle" class="small">qwen3.7-plus</text>

    <rect x="640" y="385" width="220" height="86" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="750" y="417" text-anchor="middle" class="node-title">Claims Agent</text>
    <text x="750" y="439" text-anchor="middle" class="node-sub">理赔状态与结论解释</text>
    <text x="750" y="457" text-anchor="middle" class="small">qwen3.7-plus</text>

    <rect x="1045" y="385" width="220" height="86" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="1155" y="417" text-anchor="middle" class="node-title">Complaint Agent</text>
    <text x="1155" y="439" text-anchor="middle" class="node-sub">投诉安抚与人工升级</text>
    <text x="1155" y="457" text-anchor="middle" class="small">qwen3.7-plus</text>
  </g>

  <path data-graph-role="edge" d="M690 294 V330 H345 V385" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#orange)"/>
  <path data-graph-role="edge" d="M750 294 V385" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gray)"/>
  <path data-graph-role="edge" d="M810 294 V330 H1155 V385" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gray)"/>
  <rect x="385" y="306" width="260" height="28" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="515" y="325" text-anchor="middle" class="next">下一项：v0.5 Router -&gt; Policy</text>
  <text x="750" y="366" text-anchor="middle" class="edge-label">后续</text>
  <text x="1155" y="366" text-anchor="middle" class="edge-label">后续</text>

  <g data-graph-role="container">
    <rect x="50" y="590" width="1400" height="190" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="75" y="619" class="lane">独立 QA AGENT - 当前 V0.4 运行路径</text>
    <text x="75" y="641" class="small">不参与实时 Handoff；现有 CLI、离线默认行为和 QA JSON 报告契约保持不变。</text>
  </g>
  <g data-graph-role="node">
    <rect x="170" y="674" width="190" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="265" y="704" text-anchor="middle" class="node-title">已完成对话</text>
    <text x="265" y="726" text-anchor="middle" class="node-sub">CLI fixture 输入</text>
    <rect x="610" y="674" width="280" height="70" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="750" y="704" text-anchor="middle" class="node-title">QA Agent</text>
    <text x="750" y="726" text-anchor="middle" class="node-sub">规则 + 可选 RAG / 语义质检</text>
    <rect x="1140" y="674" width="190" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="1235" y="704" text-anchor="middle" class="node-title">QA JSON 报告</text>
    <text x="1235" y="726" text-anchor="middle" class="node-sub">稳定契约</text>
  </g>
  <path data-graph-role="edge" d="M360 709 H610" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>
  <path data-graph-role="edge" d="M890 709 H1140" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>
  <rect x="1160" y="615" width="235" height="28" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="1277" y="634" text-anchor="middle" class="current">当前：v0.4 QA</text>

  <g data-graph-role="legend" transform="translate(70,835)">
    <line x1="0" y1="8" x2="40" y2="8" stroke="#2563eb" stroke-width="2.3" marker-end="url(#blue)"/>
    <text x="52" y="12" class="small">当前 QA 路径</text>
    <line x1="245" y1="8" x2="285" y2="8" stroke="#ea580c" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#orange)"/>
    <text x="297" y="12" class="small">v0.5 下一项</text>
    <line x1="535" y1="8" x2="575" y2="8" stroke="#6b7280" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#gray)"/>
    <text x="587" y="12" class="small">后续 Handoff</text>
  </g>
  <text x="70" y="878" class="small">所有模型仍默认使用 Qwen；OpenAI 托管 tracing 默认关闭，本地审计为正式路径。</text>
</svg>
