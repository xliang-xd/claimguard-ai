  <text x="617" y="237" text-anchor="middle" class="node-title">Policy Tool</text>
  <text x="617" y="259" text-anchor="middle" class="node-sub">检索 + 重排</text>
  <rect data-graph-role="node" data-node-id="ledger" x="720" y="205" width="125" height="78" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="5 3"/>
