  <text x="782" y="259" text-anchor="middle" class="node-sub">内存 / 当前轮</text>
  <rect data-graph-role="node" data-node-id="judge" x="885" y="205" width="125" height="78" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
