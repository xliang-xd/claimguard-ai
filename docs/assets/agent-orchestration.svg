<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">ClaimGuard AI Agent Orchestration</title>
  <desc id="desc">ClaimGuard AI exposes two product agents: QA Agent and Copilot Agent. Shared workflow nodes use domestic Qwen model defaults.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { fill: #111827; font-size: 26px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 14px; }
    .layer-label { fill: #6b7280; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .node-title { fill: #111827; font-size: 15px; font-weight: 700; }
    .node-sub { fill: #4b5563; font-size: 12px; }
    .small { fill: #6b7280; font-size: 11px; }
    .edge-label { fill: #374151; font-size: 11px; }
    .badge-text { fill: #065f46; font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
  </defs>
  <g data-graph-role="background">
    <rect width="1200" height="760" fill="#ffffff"/>
    <line x1="50" y1="96" x2="1150" y2="96" stroke="#e5e7eb" stroke-width="1.4"/>
    <text x="50" y="118" class="layer-label">TEXT SERVICE INPUTS</text>
    <line x1="50" y1="216" x2="1150" y2="216" stroke="#e5e7eb" stroke-width="1.4"/>
    <text x="50" y="238" class="layer-label">ORCHESTRATION</text>
    <line x1="50" y1="336" x2="1150" y2="336" stroke="#e5e7eb" stroke-width="1.4"/>
    <text x="50" y="358" class="layer-label">PRODUCT AGENTS</text>
    <line x1="50" y1="476" x2="1150" y2="476" stroke="#e5e7eb" stroke-width="1.4"/>
    <text x="50" y="498" class="layer-label">WORKFLOW NODES</text>
    <line x1="50" y1="616" x2="1150" y2="616" stroke="#e5e7eb" stroke-width="1.4"/>
    <text x="50" y="638" class="layer-label">DOMESTIC MODELS</text>
  </g>
  <g data-graph-role="label">
    <text x="60" y="48" class="title">ClaimGuard AI Agent Orchestration</text>
    <text x="60" y="72" class="subtitle">Two product agents; shared workflow tools; domestic Qwen defaults for cost and compliance.</text>
    <rect x="872" y="28" width="258" height="40" rx="20" fill="#ecfdf5" stroke="#10b981"/>
    <text x="1001" y="53" text-anchor="middle" class="badge-text">Current: v0.2.2 docs + deterministic QA</text>
  </g>
  <path data-graph-role="edge" data-source="completed_chat" data-target="orchestrator" d="M 300,184 L 300,210 L 520,210 L 520,226" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text data-graph-role="label" x="410" y="198" text-anchor="middle" class="edge-label">completed chat</text>
  <path data-graph-role="edge" data-source="active_message" data-target="orchestrator" d="M 900,184 L 900,210 L 680,210 L 680,226" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text data-graph-role="label" x="790" y="198" text-anchor="middle" class="edge-label">active message</text>
  <path data-graph-role="edge" data-source="orchestrator" data-target="qa_agent" d="M 530,314 L 530,330 L 330,330 L 330,346" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text data-graph-role="label" x="438" y="323" text-anchor="middle" class="edge-label">review</text>
  <path data-graph-role="edge" data-source="orchestrator" data-target="copilot_agent" d="M 670,314 L 670,330 L 870,330 L 870,346" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text data-graph-role="label" x="762" y="323" text-anchor="middle" class="edge-label">assist</text>
  <path data-graph-role="edge" data-source="qa_agent" data-target="intent_router" d="M 280,435 L 280,460 L 228,460 L 228,486" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path data-graph-role="edge" data-source="qa_agent" data-target="rule_selector" d="M 380,435 L 380,460 L 408,460 L 408,486" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path data-graph-role="edge" data-source="copilot_agent" data-target="retriever" d="M 820,435 L 820,460 L 768,460 L 768,486" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path data-graph-role="edge" data-source="copilot_agent" data-target="risk_guard" d="M 920,435 L 920,460 L 948,460 L 948,486" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path data-graph-role="edge" data-source="judge_writer" data-target="qwen_models" d="M 600,572 L 600,600 L 600,626" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
  <text data-graph-role="label" x="650" y="603" text-anchor="middle" class="edge-label">model calls</text>
  <path data-graph-role="edge" data-source="retriever" data-target="embedding_rerank" d="M 768,572 L 768,600 L 770,626" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text data-graph-role="label" x="812" y="603" text-anchor="middle" class="edge-label">RAG</text>
  <path data-graph-role="edge" data-source="rule_selector" data-target="policy_rules" d="M 408,572 L 408,600 L 420,626" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text data-graph-role="label" x="455" y="603" text-anchor="middle" class="edge-label">rules</text>
  <g data-graph-role="node" data-node-id="completed_chat">
    <rect x="170" y="126" width="260" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
    <text x="300.0" y="154" text-anchor="middle" class="node-title">Completed Text Conversation</text>
    <text x="300.0" y="177" text-anchor="middle" class="node-sub">QA input</text>
  </g>
  <g data-graph-role="node" data-node-id="active_message">
    <rect x="770" y="126" width="260" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
    <text x="900.0" y="154" text-anchor="middle" class="node-title">Active Customer Message</text>
    <text x="900.0" y="177" text-anchor="middle" class="node-sub">Copilot input</text>
  </g>
  <g data-graph-role="node" data-node-id="orchestrator">
    <rect x="460" y="236" width="280" height="76" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2.2"/>
    <rect x="465" y="241" width="270" height="66" rx="8" fill="none" stroke="#ddd6fe" stroke-width="1"/>
    <text x="600" y="264" text-anchor="middle" class="node-title">ClaimGuard Orchestrator</text>
    <text x="600" y="287" text-anchor="middle" class="node-sub">input routing</text>
    <text x="600" y="305" text-anchor="middle" class="node-sub">stable contracts</text>
  </g>
  <g data-graph-role="node" data-node-id="qa_agent">
    <rect x="170" y="356" width="320" height="78" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="330.0" y="384" text-anchor="middle" class="node-title">QA Agent</text>
    <text x="330.0" y="407" text-anchor="middle" class="node-sub">after-chat inspection</text>
    <text x="330.0" y="425" text-anchor="middle" class="node-sub">score, findings, evidence</text>
  </g>
  <g data-graph-role="node" data-node-id="copilot_agent">
    <rect x="710" y="356" width="320" height="78" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/>
    <text x="870.0" y="384" text-anchor="middle" class="node-title">Copilot Agent</text>
    <text x="870.0" y="407" text-anchor="middle" class="node-sub">live service assistance</text>
    <text x="870.0" y="425" text-anchor="middle" class="node-sub">reply, risk warnings, citations</text>
  </g>
  <g data-graph-role="node" data-node-id="intent_router">
    <rect x="120" y="488" width="155" height="84" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
    <text x="197.5" y="516" text-anchor="middle" class="node-title">Intent Router</text>
    <text x="197.5" y="539" text-anchor="middle" class="node-sub">customer intent</text>
    <text x="197.5" y="557" text-anchor="middle" class="node-sub">scenario</text>
  </g>
  <g data-graph-role="node" data-node-id="rule_selector">
    <rect x="320" y="488" width="175" height="84" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
    <text x="407.5" y="516" text-anchor="middle" class="node-title">Rule Selector</text>
    <text x="407.5" y="539" text-anchor="middle" class="node-sub">semantic/process</text>
    <text x="407.5" y="557" text-anchor="middle" class="node-sub">knowledge rules</text>
  </g>
  <g data-graph-role="node" data-node-id="judge_writer">
    <rect x="520" y="488" width="175" height="84" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
    <text x="607.5" y="516" text-anchor="middle" class="node-title">Judge / Writer</text>
    <text x="607.5" y="539" text-anchor="middle" class="node-sub">QA Judge</text>
    <text x="607.5" y="557" text-anchor="middle" class="node-sub">Reply Writer</text>
  </g>
  <g data-graph-role="node" data-node-id="retriever">
    <rect x="720" y="488" width="155" height="84" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
    <text x="797.5" y="516" text-anchor="middle" class="node-title">Retriever</text>
    <text x="797.5" y="539" text-anchor="middle" class="node-sub">policy clauses</text>
    <text x="797.5" y="557" text-anchor="middle" class="node-sub">top-k context</text>
  </g>
  <g data-graph-role="node" data-node-id="risk_guard">
    <rect x="920" y="488" width="155" height="84" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
    <text x="997.5" y="516" text-anchor="middle" class="node-title">Risk Guard</text>
    <text x="997.5" y="539" text-anchor="middle" class="node-sub">commitments</text>
    <text x="997.5" y="557" text-anchor="middle" class="node-sub">tone warnings</text>
  </g>
  <g data-graph-role="node" data-node-id="policy_rules">
    <rect x="220" y="628" width="210" height="62" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
    <text x="325.0" y="656" text-anchor="middle" class="node-title">Policy + Rule Catalog</text>
    <text x="325.0" y="679" text-anchor="middle" class="node-sub">local fixtures today</text>
  </g>
  <g data-graph-role="node" data-node-id="qwen_models">
    <rect x="495" y="628" width="210" height="62" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.6"/>
    <text x="600.0" y="656" text-anchor="middle" class="node-title">Qwen Model Stack</text>
    <text x="600.0" y="679" text-anchor="middle" class="node-sub">flash, plus, max</text>
  </g>
  <g data-graph-role="node" data-node-id="embedding_rerank">
    <rect x="770" y="628" width="230" height="62" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.6"/>
    <text x="885.0" y="656" text-anchor="middle" class="node-title">Embedding + Rerank</text>
    <text x="885.0" y="679" text-anchor="middle" class="node-sub">text-embedding-v4, qwen3-rerank</text>
  </g>
  <g data-graph-role="legend" transform="translate(70,720)">
    <line x1="0" y1="8" x2="36" y2="8" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="46" y="12" class="small">product flow</text>
    <line x1="175" y1="8" x2="211" y2="8" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
    <text x="221" y="12" class="small">RAG grounding</text>
    <line x1="350" y1="8" x2="386" y2="8" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
    <text x="396" y="12" class="small">model call</text>
    <line x1="520" y1="8" x2="556" y2="8" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="566" y="12" class="small">rule lookup</text>
  </g>
</svg>