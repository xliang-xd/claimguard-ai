  <path data-graph-role="edge" data-edge-id="router-policy" data-source="router" data-target="policy" d="M350 244 H390" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#green)"/>
  <path data-graph-role="edge" data-edge-id="policy-tool" data-source="policy" data-target="tool" d="M515 244 H555" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#green)"/>
  <path data-graph-role="edge" data-edge-id="tool-ledger" data-source="tool" data-target="ledger" d="M680 244 H720" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#green)"/>
  <path data-graph-role="edge" data-edge-id="ledger-judge" data-source="ledger" data-target="judge" d="M845 244 H885" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#green)"/>
  <path data-graph-role="edge" data-edge-id="judge-gate" data-source="judge" data-target="gate" d="M1010 244 H1050" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#green)"/>
  <text x="452" y="181" text-anchor="middle" class="current">唯一已实现 Handoff：Router -&gt; Policy</text>

  <rect data-graph-role="node" data-node-id="supported" x="835" y="372" width="135" height="70" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="902" y="402" text-anchor="middle" class="node-title">交付草稿</text>
  <text x="902" y="424" text-anchor="middle" class="node-sub">supported</text>
  <rect data-graph-role="node" data-node-id="takeover" x="1010" y="372" width="125" height="70" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="1072" y="402" text-anchor="middle" class="node-title">转人工</text>
  <text x="1072" y="424" text-anchor="middle" class="node-sub">其余结果</text>
  <path data-graph-role="edge" data-edge-id="gate-supported" data-source="gate" data-target="supported" d="M1088 283 V330 H902 V372" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#green)"/>
  <path data-graph-role="edge" data-edge-id="gate-takeover" data-source="gate" data-target="takeover" d="M1118 283 V372" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#gray)"/>
  <text x="902" y="350" text-anchor="middle" class="current">保存本进程会话状态</text>

  <rect data-graph-role="container" id="qa-path" x="40" y="530" width="790" height="135" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="64" y="558" class="lane">独立 QA Agent：默认离线，不进入 Copilot Handoff</text>
  <rect data-graph-role="node" data-node-id="qa-conversation" x="78" y="584" width="150" height="54" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="153" y="617" text-anchor="middle" class="node-title">已完成对话</text>
  <rect data-graph-role="node" data-node-id="qa-agent" x="350" y="584" width="160" height="54" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="430" y="617" text-anchor="middle" class="node-title">QA Agent</text>
  <rect data-graph-role="node" data-node-id="qa-report" x="632" y="584" width="150" height="54" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="707" y="617" text-anchor="middle" class="node-title">QA JSON 报告</text>
  <path data-graph-role="edge" data-edge-id="qa-conversation-agent" data-source="qa-conversation" data-target="qa-agent" d="M228 611 H350" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
  <path data-graph-role="edge" data-edge-id="qa-agent-report" data-source="qa-agent" data-target="qa-report" d="M510 611 H632" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>

  <rect data-graph-role="container" id="future" x="870" y="530" width="290" height="135" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="895" y="558" class="future">v0.7.0 下一项</text>
  <text x="895" y="588" class="note">仅为后续边界，</text>
  <text x="895" y="610" class="note">不代表当前 Agent、</text>
  <text x="895" y="632" class="note">工具或服务接口。</text>

  <g data-graph-role="legend" transform="translate(50,697)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#16a34a" stroke-width="2.2" marker-end="url(#green)"/>
    <text x="45" y="4" class="note">当前 Copilot 路径</text>
    <line x1="230" y1="0" x2="264" y2="0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
    <text x="275" y="4" class="note">独立 QA 路径</text>
    <line x1="450" y1="0" x2="484" y2="0" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#gray)"/>
    <text x="495" y="4" class="note">后续边界</text>
  </g>
