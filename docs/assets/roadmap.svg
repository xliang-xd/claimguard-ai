<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="title desc">
  <title id="title">ClaimGuard AI Roadmap</title>
  <desc id="desc">Roadmap from QA CLI and rule runner through RAG grounding, LLM judge, web demo, and v1 portfolio demo.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { fill: #111827; font-size: 26px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 14px; }
    .version { fill: #111827; font-size: 15px; font-weight: 700; }
    .label { fill: #4b5563; font-size: 12px; }
    .small { fill: #6b7280; font-size: 11px; }
    .current { fill: #065f46; font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="440" fill="#ffffff"/>
  <text x="60" y="50" class="title">ClaimGuard AI Roadmap</text>
  <text x="60" y="74" class="subtitle">Versioned delivery path: patch releases for small docs/fixes, minor releases for capability milestones, major releases for polished demos.</text>
  <line x1="110" y1="220" x2="1080" y2="220" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="130" y1="220" x2="130" y2="178" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="130" cy="220" r="10" fill="#60a5fa"/>
  <rect x="56" y="104" width="148" height="74" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="130" y="130" text-anchor="middle" class="version">v0.1.0</text>
  <text x="130" y="150" text-anchor="middle" class="label">QA CLI</text>
  <text x="130" y="166" text-anchor="middle" class="small">Load fixture, output JSON</text>
  <text x="130" y="254" text-anchor="middle" class="small">done</text>
  <line x1="310" y1="220" x2="310" y2="178" stroke="#10b981" stroke-width="2"/>
  <circle cx="310" cy="220" r="10" fill="#10b981"/>
  <rect x="236" y="104" width="148" height="74" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="310" y="130" text-anchor="middle" class="version">v0.2.0</text>
  <text x="310" y="150" text-anchor="middle" class="label">Rule Runner</text>
  <text x="310" y="166" text-anchor="middle" class="small">Text-driven findings</text>
  <text x="310" y="254" text-anchor="middle" class="small">current core</text>
  <line x1="490" y1="220" x2="490" y2="178" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="490" cy="220" r="10" fill="#9ca3af"/>
  <rect x="416" y="104" width="148" height="74" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="490" y="130" text-anchor="middle" class="version">v0.2.1</text>
  <text x="490" y="150" text-anchor="middle" class="label">Visual Docs</text>
  <text x="490" y="166" text-anchor="middle" class="small">Architecture + roadmap</text>
  <text x="490" y="254" text-anchor="middle" class="small">patch</text>
  <line x1="670" y1="220" x2="670" y2="178" stroke="#fb923c" stroke-width="2"/>
  <circle cx="670" cy="220" r="10" fill="#fb923c"/>
  <rect x="596" y="104" width="148" height="74" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6"/>
  <text x="670" y="130" text-anchor="middle" class="version">v0.3.0</text>
  <text x="670" y="150" text-anchor="middle" class="label">RAG Grounding</text>
  <text x="670" y="166" text-anchor="middle" class="small">Retrieve policy clauses</text>
  <text x="670" y="254" text-anchor="middle" class="small">next</text>
  <line x1="850" y1="220" x2="850" y2="178" stroke="#c084fc" stroke-width="2"/>
  <circle cx="850" cy="220" r="10" fill="#c084fc"/>
  <rect x="776" y="104" width="148" height="74" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.6"/>
  <text x="850" y="130" text-anchor="middle" class="version">v0.4.0</text>
  <text x="850" y="150" text-anchor="middle" class="label">LLM Judge</text>
  <text x="850" y="166" text-anchor="middle" class="small">Semantic QA scoring</text>
  <text x="850" y="254" text-anchor="middle" class="small">planned</text>
  <line x1="1030" y1="220" x2="1030" y2="178" stroke="#f87171" stroke-width="2"/>
  <circle cx="1030" cy="220" r="10" fill="#f87171"/>
  <rect x="956" y="104" width="148" height="74" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.6"/>
  <text x="1030" y="130" text-anchor="middle" class="version">v1.0.0</text>
  <text x="1030" y="150" text-anchor="middle" class="label">Portfolio Demo</text>
  <text x="1030" y="166" text-anchor="middle" class="small">Usable end-to-end app</text>
  <text x="1030" y="254" text-anchor="middle" class="small">major gate</text>
  <rect x="214" y="284" width="194" height="42" rx="21" fill="#ecfdf5" stroke="#10b981"/>
  <text x="311" y="310" text-anchor="middle" class="current">Current implementation stage</text>
  <path d="M 311,284 L 311,234" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="70" y="356" width="1060" height="42" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="92" y="382" class="small">Release rule: docs and narrow fixes use patch tags; capability milestones use minor tags; v1.0.0 waits for a polished, shareable demo.</text>
</svg>