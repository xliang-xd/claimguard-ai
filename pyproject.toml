[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimguard-ai"
version = "0.4.2"
description = "Insurance text customer service Copilot and AI quality assurance system."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Lmu-xd" }
]
dependencies = [
  "openai-agents>=0.14,<0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claimguard = ["data/*.json"]

[project.scripts]
claimguard = "claimguard.cli:main"
